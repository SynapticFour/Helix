# Keep aligned with .github/workflows/ci.yml
repos:
  - repo: local
    hooks:
      - id: ci-parity
        name: GitHub CI parity (fmt + clippy + prove)
        entry: scripts/hooks/ci-check.sh
        language: script
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^standards/vendor/
      - id: end-of-file-fixer
        exclude: ^standards/vendor/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
