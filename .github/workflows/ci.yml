# Helix — CI (docs prove + helix verify). HelixTest is a sibling checkout (D1).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Helix
    steps:
      - uses: actions/checkout@v6
        with:
          path: Helix
      - name: Read HelixTest git pin
        id: helixtest_pin
        run: echo "sha=$(grep '^HELIXTEST_SHA=' VERSIONS.lock | cut -d= -f2)" >> "$GITHUB_OUTPUT"
        working-directory: Helix
      - uses: actions/checkout@v6
        with:
          repository: SynapticFour/HelixTest
          path: HelixTest
          ref: ${{ steps.helixtest_pin.outputs.sha }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - name: Fetch crates (Cargo.lock checksums)
        run: cargo fetch --locked
      - name: Prove
        env:
          TZ: UTC
          LC_ALL: C
          LANG: C
          NO_COLOR: "1"
        run: make prove
      - name: Independent verification
        env:
          TZ: UTC
          LC_ALL: C
          LANG: C
          NO_COLOR: "1"
        run: make independent-verify
      - name: Verify fixture
        run: make verify-fixture
      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Fmt
        run: cargo fmt --all -- --check
