# Helix — CI (docs prove + helix verify). HelixTest is a sibling checkout (D1).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Helix
    steps:
      - uses: actions/checkout@v6
        with:
          path: Helix
      - uses: actions/checkout@v6
        with:
          repository: SynapticFour/HelixTest
          path: HelixTest
          ref: 1832c043e1679ec283cb2113510ee33684317cce
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - name: Prove
        run: make prove
      - name: Verify fixture
        run: make verify-fixture
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Fmt
        run: cargo fmt --all -- --check
