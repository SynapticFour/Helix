[package]
name = "helix"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Synaptic Four <contact@synapticfour.com>"]
description = "Helix — VERIFY CLI around HelixTest (GA4GH conformance). Not HELIOS."
repository = "https://github.com/SynapticFour/Helix"

[[bin]]
name = "helix"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# Sibling checkout: HelixTest stays its own git root (D1). CI clones it next to Helix.
common = { path = "../HelixTest/helixtest/crates/common", package = "helixtest-common" }
framework = { path = "../HelixTest/helixtest/crates/framework", package = "helixtest-framework" }

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"

[lib]
name = "helix"
path = "src/lib.rs"
