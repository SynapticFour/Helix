[package]
name = "helix"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Synaptic Four <contact@synapticfour.com>"]
description = "Helix — DRS/WES VERIFY CLI wrapping HelixTest. Not HELIOS. Not GA4GH certification."
publish = false
repository = "https://github.com/SynapticFour/Helix"

[[bin]]
name = "helix"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
# default-features = false: no gzip/brotli (Helix-owned client; see docs/THREAT_MODEL.md).
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
jsonschema = "0.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
# Sibling checkout: HelixTest stays its own git root (D1). CI clones it next to Helix.
common = { path = "../HelixTest/helixtest/crates/common", package = "helixtest-common" }
framework = { path = "../HelixTest/helixtest/crates/framework", package = "helixtest-framework" }

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lib]
name = "helix"
path = "src/lib.rs"

[[example]]
name = "verify-fixture"
path = "examples/verify_fixture.rs"
